# Ginto FRP client tunnel config
# Expected server settings:
# - serverAddr: silverqueen.pro
# - serverPort: 7000
# - auth.method: token
# - subdomain host: *.silverqueen.pro

# Fill this in before running:
# - auth.token: your server FRP auth token (shared secret)
#
# Operator-key note:
# frp 0.67 does accept [proxies.metadatas] in TOML, and silverqueen.pro requires it:
# publish your account key as ginto_key or the subdomain will not serve.

serverAddr = "silverqueen.pro"
serverPort = 7000

[auth]
method = "token"
token = "REPLACE_WITH_YOUR_FRP_TOKEN"

[transport]
poolCount = 3

[transport.tls]
enable = true
disableCustomTLSFirstByte = true

[log]
to = "/tmp/frpc-tunnel.log"
level = "info"
maxDays = 3

[[proxies]]
name = "test-ginto-ai-4444"
type = "http"
localIP = "127.0.0.1"
localPort = 80
subdomain = "testing"
hostHeaderRewrite = "127.0.0.1"
